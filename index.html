<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medi&amp;C · Staff</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 한 가지 모습(브랜드 오렌지)으로 고정: 라이트·다크 모두 같은 색 */
:root{
  --orange:#e2651f;      /* 브랜드 오렌지: 페이지 바탕 */
  --orange-deep:#c9561a; /* 눌림·구분선 */
  --cream:#fff8f1;       /* 로고·버튼 글자 */
  --ink:#1c1714;         /* 태그라인·버튼 면 */
  --ink-soft:rgba(28,23,20,.72);
  --sans:"Inter","Pretendard","IBM Plex Sans KR",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--orange);color:var(--ink);font:16px/1.65 var(--body);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
main{flex:1;display:flex;align-items:center;justify-content:center;padding-block:64px}
.card{width:100%;max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center}
.logo{margin:0;display:inline-flex;align-items:flex-start;gap:6px;color:var(--cream);font-family:var(--sans);font-weight:600;font-size:64px;line-height:1;letter-spacing:-.02em}
.logo svg{display:block;width:248px;max-width:100%;height:auto}
.tag{margin:22px 0 0;font-family:var(--sans);font-weight:300;font-size:var(--tag,30px);letter-spacing:-.005em;line-height:1.2;color:var(--ink);white-space:nowrap}
.label{margin:36px 0 0;font-family:var(--sans);font-weight:500;font-size:12px;line-height:1.4;letter-spacing:.34em;text-transform:uppercase;color:var(--cream)}
.rule{width:28px;height:1px;background:var(--ink-soft);opacity:.5;margin:28px 0 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:54px;padding:0 44px;min-width:230px;
  background:var(--ink);color:var(--cream);border-radius:999px;text-decoration:none;font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;
  transition:background .15s, transform .15s}
.btn:hover{background:#000}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.hint{margin:22px 0 0;font-size:13px;line-height:1.7;color:var(--ink-soft);max-width:330px;word-break:keep-all;text-wrap:balance}
.hint b{font-weight:600;color:var(--ink)}
footer{border-top:1px solid rgba(28,23,20,.18);padding-block:20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-soft);letter-spacing:.02em}
@media (max-width:480px){.logo svg{width:200px}.tag{--tag:24px}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
/* 모바일: 구글 사이트가 삽입 칸 높이를 줄이므로 작은 높이에 맞춘 압축 배치 */
@media (max-height:620px) and (max-width:700px){
  main{padding-block:14px}
  .logo svg{width:150px}
  .tag{--tag:18px;margin-top:10px}
  .label{margin-top:12px;font-size:10px}
  .rule{margin:12px 0 16px}
  .btn{height:44px;min-width:200px;font-size:13px}
  .hint{margin-top:12px;font-size:11px;line-height:1.6;max-width:300px}
  footer{display:none}
}
@media (max-height:620px) and (max-width:480px){.btn{width:auto}}
.card{transform-origin:center center}
</style>
</head>
